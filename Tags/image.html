<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image</title>
    <style>
      body {
        background-color: rgb(21, 22, 19);
      }
    </style>
  </head>
  <body>
    <img
      src="https://images.pexels.com/photos/29421579/pexels-photo-29421579.jpeg"
      alt="no image"
      srcset=""
      width="400px"
    />

    <img src="./githubprifile.jpg" alt="no image" srcset="" width="400px" />

    <picture>
      <source media="(min-width: 650px)" srcset="./githubprifile.jpg" />
      <source media="(min-width: 460px)" srcset="./githubprifile.jpg-2" />
      <img src="./githubprifile.jpg" alt="" />
    </picture>
    <!-- learn docs about picture tags -->

    <!-- image map genrator use for imagse maps -->

    <!-- image map genrator -->
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="taffu.png.jpg" usemap="#image-map" />

    <map name="image-map">
      <area
      onclick="one()"
        target=""
        alt="rect"
        title="rect"
        href=""
        coords="29,231,569,811"
        shape="rect"
      />
      <area
      onclick="two()"
        target=""
        alt="poly"
        title="poly"
        href=""
        coords="378,1234,227,1024,550,1011"
        shape="poly"
      />
      <area
        target=""
        alt="circle "
        title="circle "
        href=""
        coords="710,226,115"
        shape="circle"
      />
    </map>
    <script>
        function one(){
            alert("You clicked on one")
        }
        function two(){
            alert("You clicked on Two")
        }
    </script>
  </body>
</html>
