<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <h1>Lists</h1>

    <h2>Unorderd list</h2>
    <ul>
      <li>
        1
        <ol>
          <li>h.1</li>
          <li>h.2</li>
        </ol>
      </li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
    </ul>

    <h2>Ordred list</h2>
    <ol type="I">
      <li>One</li>
      <li>Two</li>
      <li>Three</li>
    </ol>

    <dl>
      <dt>Ice Tea</dt>
      <dd>Lemon ice tea</dd>
      <dt>Hot Tea</dt>
      <dd>Hot Lemon tea</dd>
    </dl>

    <h3>Test 1</h3>
    <p>test 2</p>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi, <span>test 3</span>
      nostrum?
    </p>
    <!-- learn about block and inline element -->
  </body>
</html>
