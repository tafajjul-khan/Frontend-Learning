<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formating</title>
  </head>

  <body>
    <h1>Formating</h1>

    <p>This is <b>imporatnt</b></p>

    <p>This is <strong>imporatnt</strong></p>

    <p>This is <i>imporatnt</i></p>

    <p>This is <em>imporatnt</em></p>

    <!-- shortcut ul>li*4/any number how much you want -->
    <ul>
      <li>b: strong</li>
      <li>i; em</li>
      <li>small;</li>
      <li>sub; sup</li>
      <li>del; mark</li>
    </ul>

    <p>H<sub>2</sub>O H<sup>2</sup>O</p>

    <p>Tafajjul <small>khan</small></p>

    <p>Tafajjul <del>khan</del></p>

    <p>Tafajjul <mark>khan</mark></p>

    <!-- learn document about style atribute -->
    <h3
      style="
        text-align: center;
        color: rgb(17, 2, 2);
        background: #e5d6d6;
        font-family: 'Courier New', Courier, monospace;
      "
    >
      This tag needs some styling
    </h3>

    <p>

      <blockquote cite="elon musk">
        this is my qoute
      </blockquote>

      <q cite="elon musk">
        this is my qoute
      </q>
      
      <abbr title="Hyper Text MarkupLanguage">
        HTML
      </abbr>

      <address></address>
      <cite></cite>
      

      <bdo dir="rtl">Tafajjul khan</bdo>

      
    </p>
  </body> 
</html>
