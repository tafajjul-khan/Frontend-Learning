<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transform in css 3d</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="item" id="rotate-x">RotateX</div>
      <div class="item" id="rotate-y">RotateY</div>
      <div class="item" id="rotate-z">RotateZ</div>
      <div class="item" id="translate-x">TranslateX</div>
      <div class="item" id="translate-y">TranslateY</div>
      <div class="item" id="translate-z">TranslateZ</div>
      <div class="item" id="scale-x">ScaleX</div>
      <div class="item" id="scale-y">ScaleY</div>
      <div class="item" id="scale-z">ScaleZ</div>
    </div>
  </body>
</html>
