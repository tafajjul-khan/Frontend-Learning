<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shadows</title>
    <style>
      .circle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .circle div {
        position: absolute;
        box-sizing: border-box;
      }
      .inner-circle {
        top: 0.25vmin;
        left: 50%;
        color: #963;
        width: 8vmin;
        height: 12vmin;
        transform: rotate(7deg) translate(-50%, 0);
        background: #963;
        box-shadow:
          inset 0 0.75vmin,
          inset -0.5vmin -10vmin #eec,
          0 0 0 0.25vmin;
      }
    </style>
  </head>
  <body>
    <div class="circle">
      <div class="inner-circle"></div>
    </div>
  </body>
</html>
