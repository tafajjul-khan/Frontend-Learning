<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title>
    <style>
        .blog-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            /* Main content left, Sidebar right */
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "header  header"
                "main    sidebar"
                "footer  footer";
            min-height: 100vh;
            gap: 20px;
        }

        /* Assign elements to Grid Areas */
        .header {
            grid-area: header;
            background: #333;
            color: white;
            padding: 20px;
        }

        .main-content {
            grid-area: main;
            background: #f9f9f9;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background: #eee;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Mobile View: Switch layout using Grid Template Areas */
        @media (max-width: 768px) {
            .blog-layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main"
                    "sidebar"
                    "footer";
            }
        }
    </style>
</head>

<body>
    <div class="blog-layout">
        <header class="header">Header Section</header>

        <main class="main-content">
            <h1>Article Title</h1>
            <p>Main content goes here...</p>
        </main>

        <aside class="sidebar">Related Posts</aside>

        <footer class="footer">Footer Section</footer>
    </div>
</body>

</html>
