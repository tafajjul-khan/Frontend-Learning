<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Table</title>
    <style>
        body{
            font-family: sans-serif;
        }
        .container{
            margin: 100px;
            padding: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .card{
            background-color: antiquewhite;
            text-align: center;
            width: 300px;
            height: 300px;
            border-radius: 5px;
        }

        .card h1{
            font-size: 1.5rem;
        }
        .card h2{
            padding: 0px 10px 10px 0px;
            font-size: 2rem;
        }

        .card button {
            width: auto;
            height: 35px;
            background-color: chocolate;
            border: 2px solid white;
            border-radius: 5px;
        }

        .card button:hover{
            background-color: brown;
        }
        @media (max-width: 600px){
            .container{
                margin: 0;
                padding: 0;
            }
        }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Basic</h1>
        <h2>$10.99</h2>
        <p>....</p>
        <p>....</p>
        <p>....</p>
        <button>Sign Up</button>
      </div>

    </div>
  </body>
</html>
